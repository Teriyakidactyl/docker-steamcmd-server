name: Build Docker Images

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        image: 
          - trixie
          - trixie-wine
          - trixie-proton
          - bookworm
          - bookworm-wine
          - bookworm-proton

    env:
      # Shared build args
      WINE_VERSION: "9.21"
      WINE_BRANCH: "staging"
      WINE_ID: "debian"
      WINE_DIST: "bookworm"
      WINE_TAG: "-1"

      PROTON_VERSION:

      # Box64 and Box86 Versions
      BOX64_VERSION: "0.3.0+20240710.62695ce-1"
      BOX86_VERSION: "0.3.7+20240707.fcbebfa-1"

      # Debian Tags: https://hub.docker.com/_/debian
      DEBIAN_TRIXIE_TAG: "trixie-20241016-slim"
      DEBIAN_BOOKWORM_TAG: "bookworm-20241016-slim"

    steps:
      # Check out the repository code
      - name: Check out repository
        uses: actions/checkout@v2

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # Cache Docker layers to speed up subsequent builds
      - name: Cache Docker layers
        uses: actions/cache@v2.1.4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Log in to GitHub Container Registry (only for pushes, not PRs)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # Set the correct Debian tag based on the image type and Compatibility Layer (Wine/Proton)
      - name: Set Debian and Compatibility Layer Tag
        run: |
          # Set Debian base tag
          if [[ "${{ matrix.image }}" == "trixie"* ]]; then
            echo "DEBIAN_TAG=${{ env.DEBIAN_TRIXIE_TAG }}" >> $GITHUB_ENV
            echo "DEBIAN_BASE=trixie" >> $GITHUB_ENV
          elif [[ "${{ matrix.image }}" == "bookworm"* ]]; then
            echo "DEBIAN_TAG=${{ env.DEBIAN_BOOKWORM_TAG }}" >> $GITHUB_ENV
            echo "DEBIAN_BASE=bookworm" >> $GITHUB_ENV
          fi
      
          if [[ "${{ runner.arch }}" == *"arm"* ]]; then
            echo "DEBUGGER=box86" >> $GITHUB_ENV
            echo "APP_COMMAND_PREFIX=box64 " >> $GITHUB_ENV
          fi
      
          # Set Compatibility Layer suffix (Wine/Proton)
          if [[ "${{ matrix.image }}" == *"wine" ]]; then
            echo "COMPAT_LAYER=-wine" >> $GITHUB_ENV
            echo "APP_COMMAND_PREFIX=wine64 $APP_COMMAND_PREFIX" >> $GITHUB_ENV
          elif [[ "${{ matrix.image }}" == *"proton" ]]; then
            echo "COMPAT_LAYER=-proton" >> $GITHUB_ENV
            echo "APP_COMMAND_PREFIX=proton $APP_COMMAND_PREFIX" >> $GITHUB_ENV
          fi

      # Generate metadata for Docker image, including tags
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/teriyakidactyl/docker-steamcmd-server
          tags: |
            ${{ github.ref == 'refs/heads/dev' && format('{0}_dev', matrix.image) || matrix.image }}
            ${{ github.ref == 'refs/heads/dev' && 'latest_dev' || 'latest' }} 
          labels: |
            org.opencontainers.image.title=SteamCMD Server Base Images
            org.opencontainers.image.description=A base image with common elements
            org.opencontainers.image.vendor=TeriyakiDactyl
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ steps.prep.outputs.build_date }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.example.git.branch=${{ github.ref_name }}

      # Prepare additional build arguments
      - name: Prepare build arguments
        id: prep
        run: |
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      # Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.prep.outputs.build_date }}
            BRANCH_NAME=${{ github.ref_name }}
            IMAGE_NAME=${{ matrix.image }}
            DEBIAN_TAG=${{ env.DEBIAN_TAG }}
            COMPAT_LAYER=${{ env.COMPAT_LAYER }}
            DEBUGGER=${{ env.DEBUGGER }}
            APP_COMMAND_PREFIX=${{ env.APP_COMMAND_PREFIX }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64  # Multi-architecture build
