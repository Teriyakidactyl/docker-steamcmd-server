name: Build Docker Images

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        image: 
          - trixie-20241016-slim
          - bookworm-20241016-slim
        compat_layer:
          - ""
          - "wine"
          - "proton"
        platform:
          - "linux/amd64"
          - "linux/arm64"

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: teriyakidactyl/docker-steamcmd-server
      # Compatibility versions
      WINE_VERSION: "9.21"
      WINE_BRANCH: "staging"
      WINE_ID: "debian"
      WINE_DIST: "bookworm"
      WINE_TAG: "-1"
      PROTON_VERSION: ""
      BOX64_VERSION: "0.3.0+20240710.62695ce-1"
      BOX86_VERSION: "0.3.7+20240707.fcbebfa-1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Prepare build metadata
        id: prep
        run: |
          # Extract Debian version codename
          DEBIAN_VERSION_CODENAME=$(echo ${{ matrix.image }} | cut -d'-' -f1)
          echo "DEBIAN_VERSION_CODENAME=$DEBIAN_VERSION_CODENAME" >> $GITHUB_ENV

          # Set debugger based on platform
          DEBUGGER=""
          if [[ "${{ matrix.platform }}" == *"arm"* ]]; then
            DEBUGGER="box86"
          fi
          echo "DEBUGGER=$DEBUGGER" >> $GITHUB_ENV

          # Configure command prefix
          APP_COMMAND_PREFIX=""
          if [[ "${{ matrix.platform }}" == *"arm"* ]]; then
            APP_COMMAND_PREFIX="box64 "
          fi
          if [[ "${{ matrix.compat_layer }}" == "wine" ]]; then
            APP_COMMAND_PREFIX="wine $APP_COMMAND_PREFIX"
          elif [[ "${{ matrix.compat_layer }}" == "proton" ]]; then
            APP_COMMAND_PREFIX="proton $APP_COMMAND_PREFIX"
          fi
          echo "APP_COMMAND_PREFIX=$APP_COMMAND_PREFIX" >> $GITHUB_ENV

          # Set build date in UTC
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Base image tag (e.g., bookworm-20241016-slim)
            type=raw,value=${{ matrix.image }}
            # Base image with dev suffix if not main branch
            type=raw,value=${{ matrix.image }}_dev,enable=${{ github.ref != 'refs/heads/main' }}
            
            # Compatibility layer tags (if specified)
            type=raw,value=${{ matrix.image }}-${{ matrix.compat_layer }},enable=${{ matrix.compat_layer != '' }}
            type=raw,value=${{ matrix.image }}-${{ matrix.compat_layer }}_dev,enable=${{ matrix.compat_layer != '' && github.ref != 'refs/heads/main' }}
            
            # Debian codename with compatibility layer
            type=raw,value=${{ env.DEBIAN_VERSION_CODENAME }}-${{ matrix.compat_layer }},enable=${{ matrix.compat_layer != '' }}
            type=raw,value=${{ env.DEBIAN_VERSION_CODENAME }}-${{ matrix.compat_layer }}_dev,enable=${{ matrix.compat_layer != '' && github.ref != 'refs/heads/main' }}
            
            # Latest tags
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest_dev,enable=${{ github.ref == 'refs/heads/dev' }}
          labels: |
            org.opencontainers.image.title=SteamCMD Server Base Images
            org.opencontainers.image.description=A base image with common elements
            org.opencontainers.image.vendor=TeriyakiDactyl
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.example.git.branch=${{ github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BRANCH_NAME=${{ github.ref_name }}
            IMAGE_NAME=${{ matrix.image }}
            DEBIAN_VERSION_CODENAME=${{ env.DEBIAN_VERSION_CODENAME }}
            COMPAT_LAYER=${{ matrix.compat_layer }}
            DEBUGGER=${{ env.DEBUGGER }}
            APP_COMMAND_PREFIX=${{ env.APP_COMMAND_PREFIX }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ matrix.platform }}