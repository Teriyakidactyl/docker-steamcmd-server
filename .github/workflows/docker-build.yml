# File: .github/workflows/build-docker-images.yml
# Purpose: Build and publish multi-architecture Docker images for SteamCMD server
# 
# This workflow builds Docker images with various combinations of:
# - Debian base images (trixie, bookworm)
# - Compatibility layers (native, wine-staging-10.5, wine-staging-10.4, proton [future])
# - Architectures (amd64, arm64)

name: Build Docker Images

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'dockerfile'
      - '.github/workflows/**'
      - 'docker/**'
      - 'installers/**'
      - 'scripts/**'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'dockerfile'
      - '.github/workflows/**'
      - 'docker/**'
      - 'installers/**'
      - 'scripts/**'
  workflow_dispatch:  # Allows manual triggering

# Add concurrency control to cancel in-progress workflows when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global environment variables used throughout the workflow
env:
  # Registry information
  REGISTRY_IMAGE: ghcr.io/teriyakidactyl/docker-steamcmd-server
  
  # ===== Matrix Configuration =====
  # Debian Tags: https://hub.docker.com/_/debian
  MATRIX_IMAGES: |
    trixie-20250407-slim
    bookworm-20250407-slim
  
  # Compatibility layers with specific versions
  MATRIX_COMPAT_LAYERS: |
    native
    wine-staging-10.5
    wine-stable-10.0.0.0
    
  # Wine configurations
  # Source: https://gitlab.winehq.org/wine/wine/-/releases
  # Example: https://dl.winehq.org/wine-builds/debian/dists/bookworm/main/binary-amd64/
  # TODO: Add "proton" to MATRIX_COMPAT_LAYERS when ready (no ARM support yet)
  
  # Target platforms
  MATRIX_PLATFORMS: |
    linux/amd64
    linux/arm64
  
  # ===== Software Versions =====
  # Wine configuration (defaults, may be overridden by matrix values)
  WINE_ID: "debian"
  WINE_TAG: "-1"

  # Proton configuration
  # Source: https://github.com/ValveSoftware/Proton/releases
  PROTON_VERSION: "9.0-4"
  
  # Box86/Box64 versions (for ARM compatibility)
  # NOTE browse files by commit to get more permanent link!
  BOX86_VERSION: "0.3.9"
      # https://github.com/ptitSeb/box86/releases
  BOX86_DEB_URL: "https://github.com/ryanfortner/box86-debs/raw/2c23402be23090b484f3bc87da61e76a163a0dfc/debian/box86-generic-arm_0.3.9+20250308.d0aad67-1_armhf.deb"
      # "https://github.com/ryanfortner/box86-debs/raw/18b3e83832df6b29af218913f0d7047f3bde2a48/debian/box86-generic-arm_0.3.7+20240706.fcbebfa-1_armhf.deb"
      # 
      # https://github.com/ryanfortner/box86-debs/tree/master/debian
      # History: https://github.com/ryanfortner/box86-debs/commits/master/debian

  BOX64_VERSION: "0.3.5"
      # Source: https://github.com/ptitSeb/box6d4/releases
  BOX64_DEB_URL: "https://github.com/ryanfortner/box64-debs/raw/9e39e5a8ac7069f80757510d3f186c775334d9a9/debian/box64_0.3.5+20250425.3542c88-1_arm64.deb"
      # https://github.com/ryanfortner/box64-debs/tree/master/debian

  # Runner architecture (will be set in jobs)
  RUNNER_ARCH: amd64

jobs:
  # Setup job to process matrix values from environment variables
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Set timeout limit
    outputs:
      image-tags: ${{ steps.set-matrix.outputs.image-tags }}
      compat-layers: ${{ steps.set-matrix.outputs.compat-layers }}
      platforms: ${{ steps.set-matrix.outputs.platforms }}
      runner-arch: ${{ steps.set-runner-arch.outputs.arch }}
    steps:
      - id: set-matrix
        name: Process matrix configurations
        run: |
          # Process the multiline env vars into JSON arrays for matrix strategy
          # Remove empty lines, add quotes, convert to JSON array
          echo "image-tags=$(echo '${{ env.MATRIX_IMAGES }}' | grep -v '^$' | awk '{print "\""$0"\""}' | paste -sd, | awk '{print "["$0"]"}')" >> $GITHUB_OUTPUT
          echo "compat-layers=$(echo '${{ env.MATRIX_COMPAT_LAYERS }}' | grep -v '^$' | awk '{print "\""$0"\""}' | paste -sd, | awk '{print "["$0"]"}')" >> $GITHUB_OUTPUT
          echo "platforms=$(echo '${{ env.MATRIX_PLATFORMS }}' | grep -v '^$' | awk '{print "\""$0"\""}' | paste -sd, | awk '{print "["$0"]"}')" >> $GITHUB_OUTPUT
      
      - id: set-runner-arch
        name: Determine runner architecture
        run: |
          # Determine the architecture of the GitHub runner
          ARCH=$(uname -m)
          if [[ "$ARCH" == "x86_64" ]]; then
            echo "arch=amd64" >> $GITHUB_OUTPUT
          elif [[ "$ARCH" == "aarch64" || "$ARCH" == "arm64" ]]; then
            echo "arch=arm64" >> $GITHUB_OUTPUT
          else
            echo "arch=$ARCH" >> $GITHUB_OUTPUT
          fi
          echo "Running on architecture: $ARCH"

  # Build job that creates individual architecture-specific images
  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Set timeout limit
    outputs:
      image-built: ${{ steps.build-status.outputs.image-built }}
    strategy:
      matrix:
        image: ${{ fromJson(needs.setup.outputs.image-tags) }}
        compat_layer: ${{ fromJson(needs.setup.outputs.compat-layers) }}
        platform: ${{ fromJson(needs.setup.outputs.platforms) }}
      fail-fast: false  # Continue other matrix builds if one fails

    steps:
      # Check out the repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # Set up QEMU for multi-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # Log in to GitHub Container Registry (only for pushes, not PRs)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # Prepare Docker metadata, tags, labels, and build arguments
      - name: Prepare Docker metadata and tags
        id: prep_meta
        run: |
          # ===== Extract Architecture from platform string =====
          # Strip "linux/" prefix to get architecture (amd64 or arm64)
          ARCHITECTURE=$(echo ${{ matrix.platform }} | cut -d'/' -f2)
          echo "ARCHITECTURE=$ARCHITECTURE" >> $GITHUB_ENV

          # ===== Extract Debian Version =====
          # Get codename from image tag (e.g., "bookworm" from "bookworm-20250407-slim")
          DEBIAN_VERSION_CODENAME=$(echo ${{ matrix.image }} | cut -d'-' -f1)
          echo "DEBIAN_VERSION_CODENAME=$DEBIAN_VERSION_CODENAME" >> $GITHUB_ENV
          
          # ===== Parse Wine configuration from compat_layer =====
          # Extract wine branch and version if specified in compatibility layer
          if [[ "${{ matrix.compat_layer }}" =~ ^wine-(.+)-(.+)$ ]]; then
            WINE_BRANCH="${BASH_REMATCH[1]}"
            WINE_VERSION="${BASH_REMATCH[2]}"
            echo "WINE_BRANCH=$WINE_BRANCH" >> $GITHUB_ENV
            echo "WINE_VERSION=$WINE_VERSION" >> $GITHUB_ENV
            echo "COMPAT_LAYER=wine" >> $GITHUB_ENV
          elif [[ "${{ matrix.compat_layer }}" == "native" ]]; then
            echo "COMPAT_LAYER=" >> $GITHUB_ENV
          else
            echo "COMPAT_LAYER=${{ matrix.compat_layer }}" >> $GITHUB_ENV
          fi
      
          # ===== Build Version Tags =====
          # Format: <image>[-compat_layer][-version][_branch]
          
          # Initialize base version tag using matrix image
          TAG_VERSIONED="${{ matrix.image }}"
          
          # Add compatibility layer and version if present (only for non-native)
          if [[ "${{ matrix.compat_layer }}" != "native" ]]; then
            if [[ "${{ matrix.compat_layer }}" =~ ^wine-(.+)-(.+)$ ]]; then
              # Use the full compat_layer string with branch and version
              TAG_VERSIONED="${TAG_VERSIONED}_${{ matrix.compat_layer }}"
            elif [[ "${{ matrix.compat_layer }}" == "proton" ]]; then
              TAG_VERSIONED="${TAG_VERSIONED}_proton-${{ env.PROTON_VERSION }}"
            fi
          fi
          
          # Add dev suffix if not on main branch
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            TAG_VERSIONED="${TAG_VERSIONED}_dev"
          fi
          echo "TAG_VERSIONED=$TAG_VERSIONED-$ARCHITECTURE" >> $GITHUB_ENV
      
          # ===== Build Codename Tags =====
          # Format: <debian_codename>[-compat_layer][_branch]
          
          # Initialize with Debian codename
          TAG_CODENAME="$DEBIAN_VERSION_CODENAME"
          
          # Add compatibility layer if present (only for non-native)
          if [[ "${{ matrix.compat_layer }}" != "native" ]]; then
            if [[ "${{ matrix.compat_layer }}" =~ ^wine-(.+)-(.+)$ ]]; then
              # For wine, add both the layer and branch
              WINE_BRANCH="${BASH_REMATCH[1]}"
              TAG_CODENAME="${TAG_CODENAME}-wine-${WINE_BRANCH}"
            elif [[ "${{ matrix.compat_layer }}" == "proton" ]]; then
              TAG_CODENAME="${TAG_CODENAME}-proton"
            fi
          fi
          
          # Add dev suffix if not on main branch
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            TAG_CODENAME="${TAG_CODENAME}_dev"
          fi
          echo "TAG_CODENAME=$TAG_CODENAME-$ARCHITECTURE" >> $GITHUB_ENV
      
          # ===== Build Latest Tag =====
          # Only used for main branch - native builds
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ matrix.compat_layer }}" == "native" ]]; then
            TAG_LATEST="latest-$ARCHITECTURE"
            echo "TAG_LATEST=$TAG_LATEST" >> $GITHUB_ENV
            echo "HAS_LATEST_TAG=true" >> $GITHUB_ENV
          else
            echo "HAS_LATEST_TAG=false" >> $GITHUB_ENV
          fi
      
          # ===== Configure Platform-Specific Settings =====
          # Set up debugger for ARM platforms
          DEBUGGER=""
          if [[ "${{ matrix.platform }}" == *"arm"* ]]; then
            DEBUGGER="box86"
          fi
          echo "DEBUGGER=$DEBUGGER" >> $GITHUB_ENV
      
          # Configure command prefix based on platform and compatibility layer
          APP_COMMAND_PREFIX=""
          if [[ "${{ matrix.platform }}" == *"arm"* ]]; then
            APP_COMMAND_PREFIX="box64 "
          fi
          if [[ "${{ matrix.compat_layer }}" =~ ^wine ]]; then
            APP_COMMAND_PREFIX="wine $APP_COMMAND_PREFIX"
          elif [[ "${{ matrix.compat_layer }}" == "proton" ]]; then
            APP_COMMAND_PREFIX="proton $APP_COMMAND_PREFIX"
          fi
          # For native compatibility layer, keep the prefix as is
          echo "APP_COMMAND_PREFIX=$APP_COMMAND_PREFIX" >> $GITHUB_ENV
      
          # ===== Set Build Metadata =====
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
      
          # ===== Debug Output =====
          echo "Generated tags:"
          echo "  Architecture tag: $ARCHITECTURE"
          echo "  Version tag: $TAG_VERSIONED"
          echo "  Codename tag: $TAG_CODENAME"
          echo "  Has latest tag: $HAS_LATEST_TAG"
          echo "Platform configuration:"
          echo "  Debugger: $DEBUGGER"
          echo "  Command prefix: $APP_COMMAND_PREFIX"
          echo "Build metadata:"
          echo "  Date: $BUILD_DATE"
          echo "  Debian codename: $DEBIAN_VERSION_CODENAME"
          if [[ "${{ matrix.compat_layer }}" =~ ^wine ]]; then
            echo "Wine configuration:"
            echo "  Branch: $WINE_BRANCH"
            echo "  Version: $WINE_VERSION"
          fi

      # Generate metadata for Docker image, including tags
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            # Version Tag: Combines image name and compatibility layer with version
            # Example: 'trixie-20250407-slim_wine-staging-10.5' 
            ${{ env.TAG_VERSIONED }}

            # Codename Tag: Combines Debian version codename with compatibility layer
            # Example: 'bookworm-wine-staging'
            ${{ env.TAG_CODENAME }}
            
            # Latest Tag: Only for main branch and native builds
            type=raw,value=${{ env.TAG_LATEST }},enable=${{ env.HAS_LATEST_TAG == 'true' }}
          
          labels: |
            # https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry#labelling-container-images
            org.opencontainers.image.title=SteamCMD Server Base Images
            org.opencontainers.image.description=A base image with common elements for game servers
            org.opencontainers.image.vendor=TeriyakiDactyl
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.example.git.branch=${{ github.ref_name }}
          
      # Validate Dockerfile before building
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
        continue-on-error: true  # Continue even if linting fails

      # Build and push Docker image with improved caching
      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .         
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}            
          build-args: |
            # Build information
            SOURCE_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_VERSION=${{ env.TAG_VERSIONED }}
            TARGETPLATFORM=${{ matrix.platform }}

            # Debian configuration
            DEBIAN_TAG=${{ matrix.image }}
            DEBIAN_VERSION_CODENAME=${{ env.DEBIAN_VERSION_CODENAME }}
            
            # Compatibility Layer
            COMPAT_LAYER=${{ env.COMPAT_LAYER }}

            # Wine configuration
            WINE_VERSION=${{ env.WINE_VERSION }}
            WINE_DIST=${{ env.DEBIAN_VERSION_CODENAME }}
            WINE_BRANCH=${{ env.WINE_BRANCH }}
            WINE_ID=${{ env.WINE_ID }}
            WINE_TAG=${{ env.WINE_TAG }}

            # Proton configuration
            PROTON_VERSION=${{ env.PROTON_VERSION }}

            # Box86/Box64 configuration (for ARM)
            DEBUGGER=${{ env.DEBUGGER }}
            APP_COMMAND_PREFIX=${{ env.APP_COMMAND_PREFIX }}
            BOX86_VERSION=${{ env.BOX86_VERSION }}
            BOX64_VERSION=${{ env.BOX64_VERSION }}
            BOX86_DEB_URL=${{ env.BOX86_DEB_URL }}
            BOX64_DEB_URL=${{ env.BOX64_DEB_URL }}

          # Improved caching using GitHub's native cache
          cache-from: |
            type=gha,scope=${{ matrix.image }}-${{ matrix.compat_layer }}-${{ matrix.platform }}
          cache-to: |
            type=gha,scope=${{ matrix.image }}-${{ matrix.compat_layer }}-${{ matrix.platform }},mode=max
          platforms: ${{ matrix.platform }}

      # Basic test for the image - FIXED for cross-architecture testing
      - name: Test Docker image
        if: success() && steps.docker_build.outcome == 'success'
        run: |
          # Get runner architecture
          RUNNER_ARCH=$(uname -m)
          if [[ "$RUNNER_ARCH" == "x86_64" ]]; then
            RUNNER_ARCH="amd64"
          elif [[ "$RUNNER_ARCH" == "aarch64" ]]; then
            RUNNER_ARCH="arm64"
          fi
          echo "Runner architecture: $RUNNER_ARCH"
          
          # Get image architecture from matrix
          IMAGE_ARCH="${{ env.ARCHITECTURE }}"
          echo "Image architecture: $IMAGE_ARCH"
          
          # For PRs, test using the local image
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Testing locally built image"
            # For local testing, use the loaded Docker image directly
            # Get the image ID from the build output
            IMAGE_ID=$(docker images --format "{{.ID}}" | head -n 1)
            
            if [[ "$RUNNER_ARCH" != "$IMAGE_ARCH" ]]; then
              echo "Skipping cross-architecture testing in PR mode - would require emulation"
              echo "::notice::Image test skipped for cross-architecture in PR mode"
            else
              docker run --rm $IMAGE_ID bash -c "echo 'Image test passed'"
              echo "::notice::Image test successfully completed!"
            fi
          else
            # For pushes, we need a different approach for cross-arch testing
            if [[ "$RUNNER_ARCH" != "$IMAGE_ARCH" ]]; then
              echo "Using architecture-specific test approach for cross-architecture testing"
              
              # For arm64 images on amd64 runners, just verify the image exists but don't try to run it
              echo "Verifying image exists without running it"
              
              # Use buildx to check if the image exists in the registry without pulling
              # This avoids the need to actually pull and run the image
              echo "Checking if image exists with buildx imagetools inspect"
              
              # Check if the image exists using buildx imagetools
              if docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ env.TAG_VERSIONED }} &>/dev/null; then
                MANIFEST_CHECK="success"
              else
                MANIFEST_CHECK="error"
              fi
              
              if [[ "$MANIFEST_CHECK" == "error" ]]; then
                echo "::error::Image ${{ env.REGISTRY_IMAGE }}:${{ env.TAG_VERSIONED }} not found in registry"
                exit 1
              else
                echo "::notice::Image ${{ env.REGISTRY_IMAGE }}:${{ env.TAG_VERSIONED }} verified in registry"
              fi
            else
              # For same architecture, pull and run normally
              echo "Testing pushed image"
              docker pull ${{ env.REGISTRY_IMAGE }}:${{ env.TAG_VERSIONED }}
              docker run --rm ${{ env.REGISTRY_IMAGE }}:${{ env.TAG_VERSIONED }} bash -c "echo 'Image test passed'"
              echo "::notice::Image test successfully completed!"
            fi
          fi

      - name: Set build status
        id: build-status
        run: |
          echo "image-built=true" >> $GITHUB_OUTPUT

      # Add error handling and retry mechanism
      - name: Handle build failure
        if: failure()
        run: |
          echo "::error::Docker build failed for ${{ matrix.image }} with compatibility layer ${{ matrix.compat_layer }} on ${{ matrix.platform }}"
          echo "::error::Check the logs above for more details on the failure"

  # Create "fat manifests" - single multi-architecture manifests that combine architecture-specific images
  create-manifest:
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Set timeout limit
    if: github.event_name != 'pull_request' && needs.build.outputs.image-built == 'true'
    strategy:
      matrix:
        # Using the same centralized matrix values from setup job
        image: ${{ fromJson(needs.setup.outputs.image-tags) }}
        compat_layer: ${{ fromJson(needs.setup.outputs.compat-layers) }}
    
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
          
      - name: Extract metadata for manifest tags
        id: prep_meta
        run: |
          # Extract Debian Version codename
          DEBIAN_VERSION_CODENAME=$(echo ${{ matrix.image }} | cut -d'-' -f1)
          
          # Build base tag components
          BASE_VERSION_TAG="${{ matrix.image }}"
          BASE_CODENAME_TAG="$DEBIAN_VERSION_CODENAME"
          
          # Add compatibility layer and version if present (only for non-native)
          if [[ "${{ matrix.compat_layer }}" != "native" ]]; then
            if [[ "${{ matrix.compat_layer }}" =~ ^wine-(.+)-(.+)$ ]]; then
              # Use the full wine string with branch and version for version tag
              BASE_VERSION_TAG="${BASE_VERSION_TAG}_${{ matrix.compat_layer }}"
              
              # Extract wine branch for codename tag
              WINE_BRANCH="${BASH_REMATCH[1]}"
              BASE_CODENAME_TAG="${BASE_CODENAME_TAG}-wine-${WINE_BRANCH}"
            elif [[ "${{ matrix.compat_layer }}" == "proton" ]]; then
              BASE_VERSION_TAG="${BASE_VERSION_TAG}_proton-${{ env.PROTON_VERSION }}"
              BASE_CODENAME_TAG="${BASE_CODENAME_TAG}-proton"
            fi
          fi
          
          # Add dev suffix if not on main branch
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            BASE_VERSION_TAG="${BASE_VERSION_TAG}_dev"
            BASE_CODENAME_TAG="${BASE_CODENAME_TAG}_dev"
          fi
          
          echo "BASE_VERSION_TAG=$BASE_VERSION_TAG" >> $GITHUB_ENV
          echo "BASE_CODENAME_TAG=$BASE_CODENAME_TAG" >> $GITHUB_ENV
          
          # Set latest tag flag (only for native images on main branch)
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ matrix.compat_layer }}" == "native" ]]; then
            echo "HAS_LATEST_TAG=true" >> $GITHUB_ENV
          else
            echo "HAS_LATEST_TAG=false" >> $GITHUB_ENV
          fi
      
      # Check if both architectures were successfully built
      - name: Verify architecture images exist
        run: |
          # Check if both arch-specific images exist
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ env.BASE_VERSION_TAG }}-amd64 || { echo "::error::amd64 image not found"; exit 1; }
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ env.BASE_VERSION_TAG }}-arm64 || { echo "::error::arm64 image not found"; exit 1; }
          
          echo "Both architecture images verified to exist"
      
      # Create "fat manifests" using buildx imagetools instead of docker manifest
      - name: Create and push multi-architecture manifests
        run: |
          # Create version tag fat manifest (combines amd64 and arm64 into a single reference)
          docker buildx imagetools create --tag ${{ env.REGISTRY_IMAGE }}:${{ env.BASE_VERSION_TAG }} \
            ${{ env.REGISTRY_IMAGE }}:${{ env.BASE_VERSION_TAG }}-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${{ env.BASE_VERSION_TAG }}-arm64
          
          # Create codename tag fat manifest
          docker buildx imagetools create --tag ${{ env.REGISTRY_IMAGE }}:${{ env.BASE_CODENAME_TAG }} \
            ${{ env.REGISTRY_IMAGE }}:${{ env.BASE_CODENAME_TAG }}-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${{ env.BASE_CODENAME_TAG }}-arm64
          
          # Create latest tag if this is a native image on main branch
          if [[ "${{ env.HAS_LATEST_TAG }}" == "true" ]]; then
            # Verify the architecture-specific latest tags exist
            docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:latest-amd64 || { echo "::error::latest-amd64 image not found"; exit 1; }
            docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:latest-arm64 || { echo "::error::latest-arm64 image not found"; exit 1; }
            
            # Create the multi-arch latest tag
            docker buildx imagetools create --tag ${{ env.REGISTRY_IMAGE }}:latest \
              ${{ env.REGISTRY_IMAGE }}:latest-amd64 \
              ${{ env.REGISTRY_IMAGE }}:latest-arm64
            
            echo "::notice::Successfully created 'latest' multi-architecture manifest"
          fi
          
          echo "::notice::Successfully created version manifest for ${{ env.REGISTRY_IMAGE }}:${{ env.BASE_VERSION_TAG }}"
          echo "::notice::Successfully created codename manifest for ${{ env.REGISTRY_IMAGE }}:${{ env.BASE_CODENAME_TAG }}"

      # Handle manifest creation failure
      - name: Handle manifest failure
        if: failure()
        run: |
          echo "::error::Failed to create multi-architecture manifest"
          echo "::error::Check if all architecture-specific images were successfully built and pushed"

  # Notification job
  notify:
    needs: [create-manifest]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Set status
        id: status
        run: |
          if [[ "${{ needs.create-manifest.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=Docker images successfully built and pushed" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Failed to build or push some Docker images" >> $GITHUB_OUTPUT
          fi
      
      # Update GitHub status with workflow results
      - name: Update status
        run: |
          echo "::notice::Workflow completed with status: ${{ steps.status.outputs.status }}"
          echo "::notice::${{ steps.status.outputs.message }}"
          
          # TODO: Add additional notification methods as needed:
          # Examples:
          # - Slack notification: Using actions/slack-notify@vX.X.X
          # - Email notification: Using dawidd6/action-send-mail@vX.X.X
          # - Teams notification: Using actions/teams-notify@vX.X.X

  ## https://github.com/marketplace/actions/delete-package-versions
  ## Clean all untagged packages
  ## 100 Item limit to manage github rate limit?

  # https://blog.kotlin-academy.com/automating-deletion-of-github-packages-with-kotlin-script-84900e1bf115

  ## TODO Implement untagged cleanup, but currently it's a pain
