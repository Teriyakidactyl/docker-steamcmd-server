name: Build Docker Images

on:
  push:
    branches: [dev, main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'installers/**'
      - 'runtime/**'
      - 'tests/**'
  pull_request:
    branches: [dev, main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'installers/**'
      - 'runtime/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/teriyakidactyl/docker-steamcmd-server

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find installers runtime tests -type f -name '*.sh' -print0 | xargs -0 -r bash -n
          shellcheck --severity=error \
            installers/*.sh \
            installers/hooks/pre-startup/*.sh \
            runtime/container/*.sh \
            tests/test_prefix_hooks.sh \
            tests/compat-prefix-smoke.sh

      - name: Test compatibility prefix hooks
        run: bash tests/test_prefix_hooks.sh

      - name: Test matrix generator
        run: python .github/scripts/test_generate_matrix.py

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_matrix_json: ${{ steps.generate.outputs.build_matrix }}
      manifest_matrix_json: ${{ steps.generate.outputs.manifest_matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: generate
        name: Generate build matrices
        run: |
          build_matrix="$(python .github/scripts/generate_matrix.py \
            --job build \
            --github-ref "${{ github.ref }}" \
            --registry-image-base "${{ env.REGISTRY_IMAGE }}")"
          manifest_matrix="$(python .github/scripts/generate_matrix.py \
            --job manifest \
            --github-ref "${{ github.ref }}" \
            --registry-image-base "${{ env.REGISTRY_IMAGE }}")"
          echo "$build_matrix" | jq . >/dev/null
          echo "$manifest_matrix" | jq . >/dev/null
          {
            echo 'build_matrix<<EOF'
            echo "$build_matrix"
            echo 'EOF'
            echo 'manifest_matrix<<EOF'
            echo "$manifest_matrix"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [quality, setup]
    name: build (${{ matrix.job_display_name }})
    # Run each image on the matching native CPU architecture. In particular,
    # nesting Box64/Box32 inside QEMU-user ARM emulation changes futex robust-list
    # behavior and is not representative of an ARM64 production host.
    runs-on: ${{ matrix.platform_name == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.build_matrix_json) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ matrix.tag_versioned_arch }}
            type=raw,value=${{ matrix.tag_detailed_arch }}
            type=raw,value=${{ matrix.tag_codename_arch }}
            type=raw,value=${{ matrix.tag_latest_arch }},enable=${{ matrix.has_latest_tag_arch }}
          labels: |
            org.opencontainers.image.title=SteamCMD Server Base Images
            org.opencontainers.image.description=A base image with common elements for dedicated game servers
            org.opencontainers.image.vendor=TeriyakiDactyl
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ matrix.build_date }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ matrix.build_date }}
            BUILD_VERSION=${{ matrix.tag_versioned_arch }}
            DEBIAN_TAG=${{ matrix.base_image_name }}
            DEBIAN_VERSION_CODENAME=${{ matrix.debian_codename }}
            COMPAT_LAYER=${{ matrix.compat_layer_build_arg }}
            WINE_VERSION=${{ matrix.wine_version_arg }}
            WINE_DIST=${{ matrix.debian_codename }}
            WINE_BRANCH=${{ matrix.wine_branch_arg }}
            WINE_ID=${{ matrix.wine_id_arg }}
            WINE_TAG=${{ matrix.wine_tag_suffix_arg }}
            WINE_INSTALL_I386=${{ matrix.wine_install_i386_arg }}
            PROTON_VERSION=${{ matrix.proton_version_arg }}
            PROTON_INSTALL_I386=${{ matrix.proton_install_i386_arg }}
            BOX86_VERSION=${{ matrix.box86_version_arg }}
            BOX64_VERSION=${{ matrix.box64_version_arg }}
            BOX86_DEB_URL=${{ matrix.box86_deb_url_arg }}
            BOX64_DEB_URL=${{ matrix.box64_deb_url_arg }}
          platforms: ${{ matrix.platform_name }}
          cache-from: type=gha,scope=${{ matrix.base_image_name }}-${{ matrix.compat_layer_id }}-${{ matrix.platform_name }}
          cache-to: type=gha,scope=${{ matrix.base_image_name }}-${{ matrix.compat_layer_id }}-${{ matrix.platform_name }},mode=max

      - name: Smoke test installed tools
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}:${{ matrix.tag_versioned_arch }}
          PLATFORM: ${{ matrix.platform_name }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -e PLATFORM="$PLATFORM" \
            --entrypoint /bin/bash "$IMAGE" -lc '
              set -euo pipefail
              command -v steamcmd
              if command -v wine >/dev/null 2>&1; then
                if [ "$PLATFORM" = "linux/arm64" ]; then
                  box64 "$(command -v wine)" --version
                else
                  wine --version
                fi
              fi
              if command -v proton >/dev/null 2>&1; then command -v proton; fi
              if command -v box64 >/dev/null 2>&1; then box64 --version; fi
              if command -v box86 >/dev/null 2>&1; then box86 --version; fi
            '

      - name: Smoke test SteamCMD runtime
        if: matrix.compat_layer_type == 'native'
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}:${{ matrix.tag_versioned_arch }}
          PLATFORM: ${{ matrix.platform_name }}
        run: |
          set -euo pipefail
          last_rc=1

          for attempt in 1 2; do
            echo "SteamCMD smoke attempt $attempt/2"
            container_name="steamcmd-smoke-${GITHUB_RUN_ID}-${attempt}-${RANDOM}"
            output_file="$(mktemp)"
            stderr_file="$(mktemp)"

            set +e
            timeout --signal=TERM --kill-after=15s 330s \
              docker run \
                --name "$container_name" \
                --platform "$PLATFORM" \
                --entrypoint /bin/bash \
                "$IMAGE" -lc 'set -euo pipefail; steamcmd +login anonymous +quit' \
                >"$output_file" 2>&1
            last_rc=$?
            set -e

            cat "$output_file" || true

            if docker cp \
                "$container_name:/home/container/Steam/logs/stderr.txt" \
                "$stderr_file" >/dev/null 2>&1; then
              echo "----- SteamCMD stderr.txt -----"
              cat "$stderr_file" || true
            fi

            docker rm -f "$container_name" >/dev/null 2>&1 || true
            rm -f "$output_file" "$stderr_file"

            if [ "$last_rc" -eq 0 ]; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              sleep 5
            fi
          done

          echo "::error::SteamCMD smoke failed after 2 attempts; last exit $last_rc"
          exit "$last_rc"

      - name: Smoke test compatibility prefix
        if: matrix.compat_layer_type == 'wine' || matrix.compat_layer_type == 'proton'
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}:${{ matrix.tag_versioned_arch }}
          PLATFORM: ${{ matrix.platform_name }}
          COMPAT_LAYER_TYPE: ${{ matrix.compat_layer_type }}
        run: bash tests/compat-prefix-smoke.sh "$IMAGE" "$PLATFORM" "$COMPAT_LAYER_TYPE"

      - name: Smoke test supervisor contract
        if: matrix.compat_layer_type == 'native'
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}:${{ matrix.tag_versioned_arch }}
          PLATFORM: ${{ matrix.platform_name }}
        run: |
          common=(
            --rm
            --platform "$PLATFORM"
            -e UPDATE_ON_START=false
            -e STEAM_SERVER_APPID=0
            -e STEAM_PLATFORM_TYPE=linux
            -e APP_NAME=runtime-smoke
          )

          docker run "${common[@]}" -e APP_EXECUTABLE=/bin/true "$IMAGE"

          set +e
          docker run "${common[@]}" -e APP_COMMAND='exit 23' "$IMAGE"
          app_rc=$?
          set -e
          if [ "$app_rc" -ne 23 ]; then
            echo "::error::Expected application exit 23, got $app_rc"
            exit 1
          fi

          failing_hook="$(mktemp)"
          cat > "$failing_hook" <<'EOF'
          #!/bin/bash
          false
          echo "fatal hook continued unexpectedly" >&2
          EOF
          chmod 0755 "$failing_hook"

          if docker run "${common[@]}" \
              -e APP_EXECUTABLE=/bin/sleep \
              -e APP_ARGS='10' \
              -v "$failing_hook:/usr/local/bin/container/hooks/pre-startup/99_fail.sh:ro" \
              "$IMAGE"; then
            echo "::error::Fatal pre-startup hook was incorrectly treated as successful"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Publish validated image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ matrix.build_date }}
            BUILD_VERSION=${{ matrix.tag_versioned_arch }}
            DEBIAN_TAG=${{ matrix.base_image_name }}
            DEBIAN_VERSION_CODENAME=${{ matrix.debian_codename }}
            COMPAT_LAYER=${{ matrix.compat_layer_build_arg }}
            WINE_VERSION=${{ matrix.wine_version_arg }}
            WINE_DIST=${{ matrix.debian_codename }}
            WINE_BRANCH=${{ matrix.wine_branch_arg }}
            WINE_ID=${{ matrix.wine_id_arg }}
            WINE_TAG=${{ matrix.wine_tag_suffix_arg }}
            WINE_INSTALL_I386=${{ matrix.wine_install_i386_arg }}
            PROTON_VERSION=${{ matrix.proton_version_arg }}
            PROTON_INSTALL_I386=${{ matrix.proton_install_i386_arg }}
            BOX86_VERSION=${{ matrix.box86_version_arg }}
            BOX64_VERSION=${{ matrix.box64_version_arg }}
            BOX86_DEB_URL=${{ matrix.box86_deb_url_arg }}
            BOX64_DEB_URL=${{ matrix.box64_deb_url_arg }}
          platforms: ${{ matrix.platform_name }}
          cache-from: type=gha,scope=${{ matrix.base_image_name }}-${{ matrix.compat_layer_id }}-${{ matrix.platform_name }}

  create-manifest:
    needs: [setup, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.manifest_matrix_json) }}

    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Verify source images
        run: |
          for img in ${{ join(matrix.source_images_versioned, ' ') }} ${{ join(matrix.source_images_codename, ' ') }}; do
            docker buildx imagetools inspect "$img" >/dev/null
          done
          if [[ "${{ matrix.create_latest_tag }}" == "true" ]]; then
            for img in ${{ join(matrix.source_images_latest, ' ') }}; do
              docker buildx imagetools inspect "$img" >/dev/null
            done
          fi

      - name: Create manifests
        run: |
          docker buildx imagetools create \
            --tag "${{ matrix.target_tag_versioned }}" \
            ${{ join(matrix.source_images_versioned, ' ') }}
          docker buildx imagetools create \
            --tag "${{ matrix.target_tag_codename }}" \
            ${{ join(matrix.source_images_codename, ' ') }}
          if [[ "${{ matrix.create_latest_tag }}" == "true" ]]; then
            docker buildx imagetools create \
              --tag "${{ matrix.target_tag_latest }}" \
              ${{ join(matrix.source_images_latest, ' ') }}
          fi
