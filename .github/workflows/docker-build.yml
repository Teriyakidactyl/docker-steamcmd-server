# Github Actions > Docker BuildKit > Docker Buildx

name: Build Docker Images

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        image: 
          # Debian Tags: https://hub.docker.com/_/debian
          - trixie-20241016-slim
          - bookworm-20241016-slim
        compat_layer:
          - ""
          - "wine"
          - "proton"
        platform:
          # Matrix + Multiarch? https://github.com/docker/docs/issues/16593
          - "linux/amd64"
          - "linux/arm64"

    env:
      # Shared build args
      WINE_VERSION: "9.21"
      WINE_BRANCH: "staging"
      WINE_ID: "debian"
      WINE_DIST: "bookworm"
      WINE_TAG: "-1"

      PROTON_VERSION:

      # Box64 and Box86 Versions
      BOX64_VERSION: "0.3.0+20240710.62695ce-1"
      BOX86_VERSION: "0.3.7+20240707.fcbebfa-1"
      DEBUGGER: ${{ contains(matrix.platform, 'arm') && 'box86' || '' }}
      COMPAT_LAYER: "${{ matrix.compat_layer }}"  # Dynamically use the compat_layer from matrix
      PLATFORM: "${{ matrix.platform }}"  # Dynamically set platform from matrix
      APP_COMMAND_PREFIX: ${{ contains(matrix.platform, 'arm') && (matrix.compat_layer == 'wine' && 'box64 wine ' || matrix.compat_layer == 'proton' && 'box64 proton ' || 'box64 ') || (matrix.compat_layer == 'wine' && 'wine ' || matrix.compat_layer == 'proton' && 'proton ' || '') }}


    steps:
      # Check out the repository code
      - name: Check out repository
        uses: actions/checkout@v2

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # Cache Docker layers to speed up subsequent builds
      - name: Cache Docker layers
        uses: actions/cache@v2.1.4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Log in to GitHub Container Registry (only for pushes, not PRs)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # Generate metadata for Docker image, including tags
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/teriyakidactyl/docker-steamcmd-server
          tags: |
            # Tag based on the 'image' and 'compat_layer' matrix values
            ${{ matrix.compat_layer == '' && matrix.image || format('{0}-{1}', matrix.image, matrix.compat_layer) }}
            # Add 'dev' suffix for the 'dev' branch
            ${{ github.ref == 'refs/heads/dev' && 'latest-dev' || 'latest' }}
            # Include the base image name (without the version)
            ${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=SteamCMD Server Base Images
            org.opencontainers.image.description=A base image with common elements
            org.opencontainers.image.vendor=TeriyakiDactyl
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ steps.prep.outputs.build_date }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.example.git.branch=${{ github.ref_name }}

      # Prepare additional build arguments
      - name: Prepare build arguments
        id: prep
        run: |
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      # Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.prep.outputs.build_date }}
            BRANCH_NAME=${{ github.ref_name }}
            IMAGE_NAME=${{ matrix.image }}
            COMPAT_LAYER=${{ matrix.compat_layer }}
            DEBUGGER=${{ env.DEBUGGER }}
            WINE_VERSION=${{ env.WINE_VERSION }}
            APP_COMMAND_PREFIX=${{ env.APP_COMMAND_PREFIX}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ matrix.platform }}  # Use platforms from the matrix dynamically
          # platforms: linux/amd64,linux/arm64  # Multi-architecture build
